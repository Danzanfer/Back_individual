<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Juegos ✦</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/shared.css"/>
  <link rel="stylesheet" href="css/minijuegos.css"/>
</head>
<body>

<nav class="nav-global">
  <a href="index.html" class="nav-logo">✦ BLACKJACK</a>
  <div class="nav-links">
    <span class="coins-badge">🪙 <span data-coins>100</span></span>
    <a href="index.html"  class="nav-link">Mesa</a>
    <a href="tienda.html" class="nav-link btn-primary">+ Coins</a>
  </div>
</nav>

<div class="page">

  <div class="juego-selector">
    <div class="juego-card activo" data-juego="bart">
      <div class="icono">🎈</div>
      <div class="nombre">BART</div>
      <div class="desc">5 globos · 60 segundos</div>
      <div class="reward">±coins según riesgo</div>
    </div>
    <div class="juego-card" data-juego="memoria">
      <div class="icono">🃏</div>
      <div class="nombre">Memoria</div>
      <div class="desc">Encuentra los pares en 60s</div>
      <div class="reward">hasta +40 🪙</div>
    </div>
    <div class="juego-card" data-juego="frecuencias">
      <div class="icono">👂</div>
      <div class="nombre">Frecuencias</div>
      <div class="desc">Barrido auditivo · 3 intentos</div>
      <div class="reward">+25 🪙 por intento</div>
    </div>
  </div>

  <div class="juego-panel" id="juego-panel"></div>

  <div class="datos-panel">
    <h3>// datos recopilados</h3>
    <div id="datos-lista"></div>
  </div>

</div>

<script src="js/coins.js"></script>
<script src="js/datos.js"></script>
<script src="js/bart.js"></script>
<script src="js/memoria.js"></script>
<script src="js/frecuencias.js"></script>
<script>
  // selector de juegos
  document.querySelectorAll('.juego-card').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.juego-card').forEach(c => c.classList.remove('activo'));
      card.classList.add('activo');
      const juego = card.dataset.juego;
      if (juego === 'bart')        bartInit();
      if (juego === 'memoria')     memoriaInit();
      if (juego === 'frecuencias') frecuenciasInit();
    });
  });

  // init
  Coins.init();
  renderDatos();
  bartInit();
</script>
</body>
</html>
