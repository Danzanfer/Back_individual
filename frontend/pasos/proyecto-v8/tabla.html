<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vectores ✦</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/shared.css"/>
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('jugador_actual');
        var jugador = raw ? JSON.parse(raw) : null;
        if (!jugador || !jugador.id) window.location.replace('login.html');
      } catch(e) { window.location.replace('login.html'); }
    })();
  </script>
  <style>
    .page { max-width: 100%; padding: 1.5rem; overflow-x: auto; }

    .page-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.8rem;
    }

    .page-header h1 {
      font-family: var(--mono); font-size: 0.85rem;
      color: var(--gold); letter-spacing: 0.08em;
    }

    .header-actions { display: flex; gap: 0.6rem; align-items: center; }

    .btn-acc {
      font-family: var(--mono); font-size: 0.62rem;
      padding: 6px 14px; border: none; border-radius: 8px;
      cursor: pointer; font-weight: 700; transition: all 0.2s;
    }
    .btn-acc.primary { background: var(--gold); color: #1a1a1a; }
    .btn-acc.primary:hover { background: #f5ca50; }
    .btn-acc.ghost  { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-acc.ghost:hover { color: var(--red); border-color: var(--red); }

    .vector-count {
      font-family: var(--mono); font-size: 0.58rem; color: var(--muted);
    }
    .vector-count span { color: var(--gold); font-weight: 700; }

    .tabla-wrap {
      overflow-x: auto; border: 1px solid var(--border); border-radius: 14px;
    }

    table {
      width: 100%; border-collapse: collapse;
      font-family: var(--mono); font-size: 0.58rem; min-width: 900px;
    }

    thead tr { background: #0a0a10; }
    thead th {
      padding: 0.7rem 0.8rem; text-align: left; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
      white-space: nowrap; border-bottom: 1px solid var(--border);
    }

    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(240,192,64,0.04); }
    tbody td { padding: 0.6rem 0.8rem; color: var(--text); white-space: nowrap; }

    td.muted { color: var(--muted); font-size: 0.52rem; }
    td.gold   { color: var(--gold); font-weight: 700; }
    td.green  { color: var(--green); }
    td.red    { color: var(--red); }

    .empty-state {
      text-align: center; padding: 3rem 1rem;
      font-family: var(--mono); font-size: 0.65rem; color: var(--muted);
    }
    .empty-state strong { color: var(--gold); display: block; font-size: 1rem; margin-bottom: 0.5rem; }

    .badge {
      display: inline-block; padding: 2px 8px;
      border-radius: 10px; font-size: 0.52rem; font-weight: 700;
    }
    .badge.alto  { background: rgba(230,57,70,0.15);  color: var(--red); }
    .badge.mod   { background: rgba(240,192,64,0.15); color: var(--gold); }
    .badge.bajo  { background: rgba(80,250,123,0.15); color: var(--green); }
  </style>
</head>
<body>

<nav class="nav-global">
  <a href="index.html" class="nav-logo">✦ BLACKJACK</a>
  <div class="nav-links">
    <span class="coins-badge">🪙 <span data-coins>100</span></span>
    <a href="index.html"      class="nav-link">Mesa</a>
    <a href="minijuegos.html" class="nav-link">Mini juegos</a>
    <a href="tienda.html"     class="nav-link btn-primary">+ Coins</a>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <div>
      <h1>// VECTORES DE JUGADORES</h1>
      <div class="vector-count"><span id="total-count">0</span> registros</div>
    </div>
    <div class="header-actions">
      <button class="btn-acc primary" id="btn-generar">⊕ Guardar mi vector</button>
      <button class="btn-acc ghost"   id="btn-limpiar">Limpiar tabla</button>
    </div>
  </div>

  <div class="tabla-wrap">
    <table>
      <thead><tr id="tabla-cabecera"></tr></thead>
      <tbody id="tabla-cuerpo"></tbody>
    </table>
  </div>
</div>

<script src="js/errores.js"></script>
<script src="js/coins.js"></script>
<script src="js/vector.js"></script>
<script>
  function formatFecha(iso) {
    try {
      return new Date(iso).toLocaleString('es-ES', {
        day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'
      });
    } catch(e) { return iso || '—'; }
  }

  function badgePerfil(perfil) {
    if (!perfil || perfil === '—') return '—';
    var clase = perfil.includes('alto') ? 'alto' : perfil.includes('mod') ? 'mod' : 'bajo';
    return '<span class="badge ' + clase + '">' + perfil + '</span>';
  }

  function renderTabla() {
    var vectores = Vector.obtenerTodos();
    document.getElementById('total-count').textContent = vectores.length;

    var cabecera = document.getElementById('tabla-cabecera');
    var cuerpo   = document.getElementById('tabla-cuerpo');

    cabecera.innerHTML = Vector.COLUMNAS.map(function(c) {
      return '<th>' + c.label + '</th>';
    }).join('');

    if (!vectores.length) {
      cuerpo.innerHTML = '<tr><td colspan="' + Vector.COLUMNAS.length + '">'
        + '<div class="empty-state"><strong>Sin registros</strong>'
        + 'Pulsa "Guardar mi vector" para añadir el tuyo</div></td></tr>';
      return;
    }

    cuerpo.innerHTML = vectores.map(function(v) {
      return '<tr>' + Vector.COLUMNAS.map(function(col) {
        var val = (v[col.key] !== null && v[col.key] !== undefined) ? v[col.key] : '—';

        if (col.key === 'timestamp')     return '<td>' + formatFecha(val) + '</td>';
        if (col.key === 'bart_perfil')   return '<td>' + badgePerfil(val) + '</td>';
        if (col.key === 'jugador_id')    return '<td class="muted">' + val + '</td>';
        if (col.key === 'coins_actuales') return '<td class="gold">' + val + ' 🪙</td>';
        if (col.key === 'bj_ganadas')    return '<td class="green">' + val + '</td>';
        if (col.key === 'bj_perdidas')   return '<td class="red">' + val + '</td>';

        if (col.key === 'bart_neto' && val !== '—') {
          var cls = String(val).startsWith('+') ? 'green' : 'red';
          return '<td class="' + cls + '">' + val + '</td>';
        }

        return '<td>' + val + '</td>';
      }).join('') + '</tr>';
    }).join('');
  }

  document.getElementById('btn-generar').addEventListener('click', function() {
    try {
      Vector.guardar();
      renderTabla();
    } catch(e) {
      manejarError(e, 'tabla/guardar');
      alert(e.message);
    }
  });

  document.getElementById('btn-limpiar').addEventListener('click', function() {
    if (!confirm('¿Borrar todos los vectores?')) return;
    try { storageSet('tabla_vectores', []); renderTabla(); }
    catch(e) { manejarError(e, 'tabla/limpiar'); }
  });

  Coins.init();
  renderTabla();
</script>
</body>
</html>
