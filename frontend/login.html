<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login ✦</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/shared.css"/>

  <!-- Si ya hay sesión válida, ir directo al juego -->
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('jugador_actual');
        var jugador = raw ? JSON.parse(raw) : null;
        if (jugador && jugador.id) {
          window.location.replace('index.html');
        }
      } catch(e) {}
    })();
  </script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0e0e14;
    }

    .login-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .login-logo {
      text-align: center;
      font-family: var(--mono);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.1em;
    }

    .login-sub {
      text-align: center;
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--muted);
    }

    .campo { display: flex; flex-direction: column; gap: 0.4rem; }

    .campo label {
      font-family: var(--mono);
      font-size: 0.58rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .campo input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    .campo input:focus { border-color: var(--gold); }

    .error-msg {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--red);
      text-align: center;
      min-height: 1rem;
    }

    .weather-status {
      font-family: var(--mono);
      font-size: 0.58rem;
      color: var(--muted);
      text-align: center;
    }
    .weather-status .loc { color: var(--gold); }

    .login-demo {
      font-family: var(--mono);
      font-size: 0.55rem;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 0.8rem;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="login-logo">✦ BLACKJACK</div>
  <div class="login-sub">// acceso al sistema</div>

  <div class="campo">
    <label for="username">Usuario</label>
    <input type="text" id="username" placeholder="tu nombre de usuario" autocomplete="off"/>
  </div>

  <div class="campo">
    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="••••••••"/>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <div class="weather-status" id="weather-status">Obteniendo localización...</div>

  <button class="btn btn-gold" id="btn-login" style="width:100%">Entrar →</button>

  <div class="login-demo">demo — cualquier usuario y contraseña funcionan</div>
</div>

<script src="js/errores.js"></script>
<script src="js/weather.js"></script>
<script>
  var weatherData = null;

  // obtener localización en background
  Weather.obtener().then(function(w) {
    weatherData = w;
    var el = document.getElementById('weather-status');
    if (w.ciudad !== 'desconocida') {
      el.innerHTML = '📍 <span class="loc">' + w.ciudad + ', ' + w.pais + '</span>'
        + (w.temp ? ' · <span class="loc">' + w.temp + '</span>' : '');
    } else {
      el.textContent = 'Localización no disponible';
    }
  }).catch(function(e) {
    manejarError(e, 'login/weather');
    document.getElementById('weather-status').textContent = 'Localización no disponible';
  });

  function generarId(username) {
    var hash = 0;
    for (var i = 0; i < username.length; i++) {
      hash = ((hash << 5) - hash) + username.charCodeAt(i);
      hash |= 0;
    }
    return 'USR_' + Math.abs(hash).toString(36).toUpperCase().padStart(6, '0');
  }

  document.getElementById('btn-login').addEventListener('click', function() {
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    var errorEl  = document.getElementById('error-msg');
    errorEl.textContent = '';

    try {
      if (!username) throw new ValidationError('El usuario es obligatorio', 'username');
      if (username.length < 3) throw new ValidationError('Mínimo 3 caracteres', 'username');
      if (!password) throw new ValidationError('La contraseña es obligatoria', 'password');

      var jugador = {
        id:       generarId(username.toLowerCase()),
        username: username,
        loginAt:  new Date().toISOString(),
      };

      localStorage.setItem('jugador_actual', JSON.stringify(jugador));
      if (weatherData) storageSet('weather_cache', weatherData);

      window.location.replace('index.html');

    } catch(e) {
      manejarError(e, 'login/submit');
      errorEl.textContent = e instanceof ValidationError ? e.message : 'Error al iniciar sesión';
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('btn-login').click();
  });
</script>
</body>
</html>
