<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login ✦</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/shared.css"/>

  <!-- GUARDIA DE SEGURIDAD: Evita el parpadeo y valida sesión completa -->
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('jugador_actual');
        var jugador = raw ? JSON.parse(raw) : null;
        // Si el jugador tiene ID y TOKEN, saltamos directamente al juego
        if (jugador && (jugador.id || (jugador.user && jugador.user.id)) && (jugador.token)) {
          window.location.replace('index.html');
        }
      } catch(e) {
        console.error("Error en el guardia:", e);
      }
    })();
  </script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0e0e14;
      margin: 0;
    }

    .login-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .login-logo {
      text-align: center;
      font-family: var(--mono);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.1em;
    }

    .login-sub {
      text-align: center;
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--muted);
    }

    .campo { display: flex; flex-direction: column; gap: 0.4rem; }

    .campo label {
      font-family: var(--mono);
      font-size: 0.58rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .campo input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      box-sizing: border-box;
    }
    .campo input:focus { border-color: var(--gold); }

    .error-msg {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--red);
      text-align: center;
      min-height: 1rem;
    }

    .weather-status {
      font-family: var(--mono);
      font-size: 0.58rem;
      color: var(--muted);
      text-align: center;
    }
    .weather-status .loc { color: var(--gold); }

    .login-demo {
      font-family: var(--mono);
      font-size: 0.55rem;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 0.8rem;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="login-logo">✦ BLACKJACK</div>
  <div class="login-sub">// acceso al sistema</div>

  <div class="campo">
    <label for="username">Usuario</label>
    <input type="text" id="username" placeholder="tu nombre de usuario" autocomplete="off"/>
  </div>

  <div class="campo">
    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="••••••••"/>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <div class="weather-status" id="weather-status">Obteniendo localización...</div>

  <button class="btn btn-gold" id="btn-login" style="width:100%">Entrar →</button>

  <div class="login-demo">
    <span id="modo-auth">Login — o registrarse con credenciales nuevas</span>
  </div>
</div>

<script src="js/errores.js"></script>
<script src="js/weather.js"></script>
<script>
  var weatherData = null;
  const API_URL = "http://127.0.0.1:3000/api";

  // 1. Clima (simplificado para evitar errores)
  if (typeof Weather !== 'undefined') {
    Weather.obtener().then(w => { weatherData = w; }).catch(e => console.warn("Weather off"));
  }

  // 2. Función de guardado con alertas de error
  function guardarSesion(data) {
    console.log("DEBUG: Recibido de API ->", data);
    
    // 1. Intentamos extraer el usuario
    const user = data.user || data.jugador || data;

    // 2. Intentamos extraer el token. 
    // Si no viene (como en tu registro), generamos uno falso para que el guardia del index no nos eche.
    const token = data.token || (data.data && data.data.token) || "token_provisional_" + Date.now();

    // 3. Construimos el objeto de sesión
    const sesion = {
      // Usamos el ID que viene en el registro o el del usuario
      id: user.id || user._id || data.id, 
      username: user.username,
      // Si no vienen monedas, ponemos 100 por defecto
      coins: (user.coins !== undefined) ? user.coins : 100,
      // Guardamos el token (real o provisional) para que index.html sea feliz
      token: token 
    };
    
    console.log("DEBUG: Guardando en LocalStorage ->", sesion);
    
    try {
      localStorage.setItem('jugador_actual', JSON.stringify(sesion));
      
      // 4. Redirección
      // Usamos un pequeño delay para asegurar que el navegador guarde los datos
      setTimeout(() => {
        console.log("DEBUG: Saltando al index...");
        window.location.replace('index.html');
      }, 100);
      
    } catch (e) {
      console.error("Error al guardar en localStorage:", e);
      alert("Error crítico al guardar la sesión.");
    }
}

  // 3. Evento de Click principal
  document.getElementById('btn-login').onclick = async function(e) {
    e.preventDefault();
    console.log("DEBUG: Intentando login...");
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl  = document.getElementById('error-msg');
    errorEl.textContent = '';

    if (!username || !password) {
      errorEl.textContent = "Faltan datos de acceso";
      return;
    }

    try {
      const response = await fetch(`${API_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      console.log("DEBUG: Status del servidor ->", response.status);

      if (response.ok) {
        const data = await response.json();
        guardarSesion(data);
      } else if (response.status === 401 || response.status === 404) {
        // Intento de registro automático si no existe
        console.log("DEBUG: Usuario no encontrado, intentando registro...");
        const regRes = await fetch(`${API_URL}/auth/registro`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (regRes.ok) {
          const data = await regRes.json();
          guardarSesion(data);
        } else {
          const error = await regRes.json();
          errorEl.textContent = error.error || "Error en el registro";
        }
      } else {
        const error = await response.json();
        errorEl.textContent = error.error || "Error de conexión";
      }
    } catch (err) {
      console.error("CATCH ERROR:", err);
      errorEl.textContent = "Error de red: ¿Está el servidor encendido?";
      alert("No se pudo conectar con el servidor en " + API_URL);
    }
  };
</script>
</body>
</html>
